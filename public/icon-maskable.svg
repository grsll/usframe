<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E26A47" />
      <stop offset="50%" stop-color="#D95D39" />
      <stop offset="100%" stop-color="#B33E1D" />
    </linearGradient>
    <linearGradient id="cardGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAF5EE" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Center Scaled Content inside 80% safe zone -->
  <g transform="translate(131, 106) scale(0.83)">
    <!-- Main Card -->
    <rect x="0" y="0" width="300" height="360" rx="36" fill="url(#cardGradMask)" />
    
    <!-- Top Photo Frame (Dark) -->
    <rect x="28" y="28" width="244" height="160" rx="20" fill="#1C1917" />
    
    <!-- Duo Split Line in Photo Frame -->
    <line x1="150" y1="28" x2="150" y2="188" stroke="#332E2B" stroke-width="3" />
    
    <!-- Left Person Silhouette -->
    <circle cx="90" cy="92" r="22" fill="#E26A47" />
    <path d="M54 160 C54 130 70 120 90 120 C110 120 126 130 126 160 Z" fill="#E26A47" />
    
    <!-- Right Person Silhouette -->
    <circle cx="210" cy="92" r="22" fill="#FAF5EE" fill-opacity="0.9" />
    <path d="M174 160 C174 130 190 120 210 120 C230 120 246 130 246 160 Z" fill="#FAF5EE" fill-opacity="0.9" />

    <!-- Center Heart Emblem Connecting Both -->
    <g transform="translate(150, 108)">
      <circle cx="0" cy="0" r="22" fill="#D95D39" stroke="#FFFFFF" stroke-width="4" />
      <path d="M0 6 C0 6 -10 -2 -10 -7 C-10 -11 -7 -14 -3 -14 C-1 -14 0 -12 0 -12 C0 -12 1 -14 3 -14 C7 -14 10 -11 10 -7 C10 -2 0 6 0 6 Z" fill="#FFFFFF" />
    </g>

    <!-- Bold US Typography -->
    <text x="150" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Playfair Display', serif" font-size="62" font-weight="900" fill="#1C1917" text-anchor="middle" letter-spacing="4">US</text>
    
    <!-- Subtitle -->
    <text x="150" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#78716C" text-anchor="middle" letter-spacing="3">PHOTOBOOTH</text>

    <!-- Bottom Accent Dots -->
    <circle cx="80" cy="336" r="5" fill="#D95D39" />
    <circle cx="150" cy="336" r="5" fill="#D95D39" />
    <circle cx="220" cy="336" r="5" fill="#D95D39" />
  </g>
</svg>
